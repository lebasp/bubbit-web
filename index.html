<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Bubbit</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #111; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      /* Portrait 9:16 frame that fits any window, letterboxed on the sides or top/bottom */
      #unity-container { position: relative; aspect-ratio: 9 / 16; height: min(100vh, calc(100vw * 16 / 9)); height: min(100dvh, calc(100vw * 16 / 9)); }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #000000; outline: none; }
      #unity-loading { position: absolute; left: 15%; right: 15%; top: 50%; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
      #unity-progress { width: 0; height: 100%; background: #fff; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading"><div id="unity-progress"></div></div>
    </div>
    <script src="Build/f27362b8a87184d58bde2b56b51611a1.loader.js"></script>
    <script>
      var progress = document.querySelector("#unity-progress");
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/dc560e5417851995a026d76c9ba3252c.data.unityweb",
        frameworkUrl: "Build/c8a6d4926d6748dffa8933764020beac.framework.js.unityweb",
        codeUrl: "Build/1d08b20bfee4133674dd7398c0379b00.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Seraphic Games",
        productName: "Bubbit",
        productVersion: "2.3.4",
      }, function (p) {
        progress.style.width = (100 * p) + "%";
      }).then(function () {
        document.querySelector("#unity-loading").style.display = "none";
      }).catch(function (message) {
        alert(message);
      });
    </script>
  </body>
</html>
